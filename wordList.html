let offset=0;
const CHECK_KEY="yl_check", WRONG_KEY="yl_wrong";

function speak(text){
  if(!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US";
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function initGrades(){
  const g=document.getElementById("grade");
  Object.keys(DATA).forEach(k=>{const o=document.createElement("option");o.value=k;o.text=k;g.appendChild(o);});
}
function renderUnits(){
  const grade=document.getElementById("grade").value;
  const u=document.getElementById("unit");
  u.innerHTML='<option value="ALL">全部单元</option>';
  if(DATA[grade])Object.keys(DATA[grade]).forEach(k=>{const o=document.createElement("option");o.value=k;o.text=k;u.appendChild(o);});
}
function getWords(){
  const grade=document.getElementById("grade").value;
  const unit=document.getElementById("unit").value;
  let arr=[];
  if(!DATA[grade])return arr;
  if(unit==="ALL")Object.values(DATA[grade]).forEach(a=>arr.push(...a));
  else arr=DATA[grade][unit]||[];
  return arr;
}
function render(){
  const words=getWords();
  const day=Math.floor(Date.now()/86400000)+offset;
  document.getElementById("dayLabel").innerText="第 "+(day%365+1)+" 天 · "+new Date().toLocaleDateString();
  const perDay=5;
  const start=words.length?(day*perDay)%words.length:0;
  let pick=[];
  for(let i=0;i<perDay&&words.length;i++)pick.push(words[(start+i)%words.length]);
  const list=document.getElementById("list"); list.innerHTML="";
  const gradeVal=document.getElementById("grade").value;
  pick.forEach(w=>{
    const card=document.createElement("div"); card.className="card";
    card.onclick=()=>{card.classList.toggle("flip");speak(w.en);};
    card.innerHTML=`<div class="en">${w.en}</div><div class="ph">${w.ph||""}</div><div class="cn">${w.cn}</div><div class="phrase">📌 ${w.phrase||""}</div><div class="btns"><button class="know" onclick="event.stopPropagation();mark('${gradeVal}','${w.en}',true)">认识</button><button class="unknow" onclick="event.stopPropagation();mark('${gradeVal}','${w.en}',false)">不会</button></div>`;
    list.appendChild(card);
  });
  renderWrong();
}
function mark(grade,en,ok){
  const log=JSON.parse(localStorage.getItem(CHECK_KEY)||"{}"); log[grade+"/"+en]=ok;
  localStorage.setItem(CHECK_KEY,JSON.stringify(log));
  let wrong=JSON.parse(localStorage.getItem(WRONG_KEY)||"[]");
  const id=grade+"/"+en;
  if(!ok&&!wrong.includes(id))wrong.push(id);
  if(ok)wrong=wrong.filter(x=>x!==id);
  localStorage.setItem(WRONG_KEY,JSON.stringify(wrong)); renderWrong();
}
function renderWrong(){
  const wrong=JSON.parse(localStorage.getItem(WRONG_KEY)||"[]");
  document.getElementById("wrongList").innerHTML=wrong.map(x=>`<li onclick="speak('${x.split('/')[1]}')">🔁 ${x}</li>`).join("")||"<li>暂无错词</li>";
}
function clearWrong(){localStorage.removeItem(WRONG_KEY);renderWrong();}
function prevDay(){offset--;render();}
function nextDay(){offset++;render();}
document.getElementById("grade").onchange=()=>{renderUnits();render();};
document.getElementById("unit").onchange=render;
initGrades();renderUnits();render();
</script>
